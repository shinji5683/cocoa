name: Serena Cloud Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build APKs and Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure Keystore for CI Build
        run: |
          if [ ! -f "app/serena-release-key.jks" ]; then
            echo "Generating signing keystore for CI..."
            keytool -genkeypair -v \
              -keystore app/serena-release-key.jks \
              -alias serena_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass serena2026 \
              -keypass serena2026 \
              -dname "CN=Shinji, OU=Serena, O=Shinji, L=Tokyo, C=JP"
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare Standard Named Artifacts
        run: |
          cp app/build/outputs/apk/release/app-release.apk app-serena-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk app-serena-debug.apk
          echo "Prepared APK artifacts:"
          ls -lh app-serena-release.apk app-serena-debug.apk

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: serena-build-outputs
          path: |
            app-serena-release.apk
            app-serena-debug.apk
          retention-days: 14

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [[ "$REF_NAME" == v* ]]; then
            TARGET_TAG="$REF_NAME"
          else
            VERSION_FROM_GRADLE=$(grep 'versionName' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            TARGET_TAG="v${VERSION_FROM_GRADLE:-1.1.0}-build-${{ github.run_number }}"
          fi

          echo "Target Release Tag: $TARGET_TAG"

          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Release $TARGET_TAG already exists. Uploading and updating assets..."
            gh release upload "$TARGET_TAG" \
              app-serena-release.apk \
              app-serena-debug.apk \
              --clobber
          else
            echo "Creating new release $TARGET_TAG..."
            gh release create "$TARGET_TAG" \
              app-serena-release.apk \
              app-serena-debug.apk \
              --title "Serena $TARGET_TAG" \
              --generate-notes \
              --prerelease
          fi
          echo "GitHub Release action completed successfully!"
