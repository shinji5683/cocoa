name: Build and Release Serena APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build APK and Create GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create CI Keystore if missing
        run: |
          if [ ! -f "app/serena-release-key.jks" ]; then
            echo "Generating fallback keystore for CI build..."
            keytool -genkeypair -v \
              -keystore app/serena-release-key.jks \
              -alias serena_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass serena2026 \
              -keypass serena2026 \
              -dname "CN=Shinji, OU=Serena, O=Shinji, L=Tokyo, C=JP"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug and Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          name: "Serena ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
