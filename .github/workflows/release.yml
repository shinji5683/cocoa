name: Build and Release Serena APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure Keystore for CI Build
        run: |
          if [ ! -f "app/serena-release-key.jks" ]; then
            echo "Generating signing keystore for CI..."
            keytool -genkeypair -v \
              -keystore app/serena-release-key.jks \
              -alias serena_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass serena2026 \
              -keypass serena2026 \
              -dname "CN=Shinji, OU=Serena, O=Shinji, L=Tokyo, C=JP"
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug and Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Publish Release and Upload APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [[ "$REF_NAME" == v* ]]; then
            TARGET_TAG="$REF_NAME"
          else
            VERSION_FROM_GRADLE=$(grep 'versionName' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            TARGET_TAG="v${VERSION_FROM_GRADLE:-1.0.0}-build-${{ github.run_number }}"
          fi

          echo "Publishing release with tag: $TARGET_TAG..."

          gh release create "$TARGET_TAG" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Serena $TARGET_TAG" \
            --generate-notes \
            --prerelease
